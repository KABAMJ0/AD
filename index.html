<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Rounder</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    #preview {
      max-width: 300px;
      border-radius: 20px;
      margin-top: 20px;
    }
    input[type="range"] {
      width: 300px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      background-color: #3b82f6;
      color: white;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Image Rounder</h1>
  <input type="file" id="fileInput" accept="image/*"><br>
  <label>Corner Radius: <span id="radiusValue">20</span>px</label><br>
  <input type="range" id="radiusSlider" min="0" max="200" value="20">
  <br>
  <img id="preview" src="#" style="display: none;">
  <br>
  <button id="downloadBtn" style="display: none;">Download Rounded Image</button>

  <script>
    const fileInput = document.getElementById('fileInput');
    const radiusSlider = document.getElementById('radiusSlider');
    const radiusValue = document.getElementById('radiusValue');
    const preview = document.getElementById('preview');
    const downloadBtn = document.getElementById('downloadBtn');

    let imageDataUrl = '';
    let radius = 20;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        imageDataUrl = event.target.result;
        preview.src = imageDataUrl;
        preview.style.display = 'block';
        downloadBtn.style.display = 'inline-block';
        preview.style.borderRadius = `${radius}px`;
      };
      reader.readAsDataURL(file);
    });

    radiusSlider.addEventListener('input', (e) => {
      radius = parseInt(e.target.value);
      radiusValue.textContent = radius;
      preview.style.borderRadius = `${radius}px`;
    });

    downloadBtn.addEventListener('click', () => {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.moveTo(radius, 0);
        ctx.lineTo(canvas.width - radius, 0);
        ctx.quadraticCurveTo(canvas.width, 0, canvas.width, radius);
        ctx.lineTo(canvas.width, canvas.height - radius);
        ctx.quadraticCurveTo(canvas.width, canvas.height, canvas.width - radius, canvas.height);
        ctx.lineTo(radius, canvas.height);
        ctx.quadraticCurveTo(0, canvas.height, 0, canvas.height - radius);
        ctx.lineTo(0, radius);
        ctx.quadraticCurveTo(0, 0, radius, 0);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(img, 0, 0);

        const link = document.createElement('a');
        link.download = 'rounded-image.png';
        link.href = canvas.toDataURL();
        link.click();
      };
      img.src = imageDataUrl;
    });
  </script>
</body>
</html>
